version: "3.9"

services:
  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: azs
      POSTGRES_PASSWORD: azs_pass
      POSTGRES_DB: azs_bonus
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U azs -d azs_bonus"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command: >
      sh -c "alembic upgrade head"
    environment:
      SYNC_DATABASE_URL: postgresql+psycopg://azs:azs_pass@postgres:5432/azs_bonus
      DATABASE_URL: postgresql+asyncpg://azs:azs_pass@postgres:5432/azs_bonus
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure

  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://azs:azs_pass@postgres:5432/azs_bonus
      SYNC_DATABASE_URL: postgresql+psycopg2://azs:azs_pass@postgres:5432/azs_bonus
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
      APP_ENV: production
      DEBUG: "false"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  celery-worker:
    build: .
    command: celery -A app.celery_app worker --loglevel=info --concurrency=4
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://azs:azs_pass@postgres:5432/azs_bonus
      SYNC_DATABASE_URL: postgresql+psycopg2://azs:azs_pass@postgres:5432/azs_bonus
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-beat:
    build: .
    command: celery -A app.celery_app beat --loglevel=info
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://azs:azs_pass@postgres:5432/azs_bonus
      SYNC_DATABASE_URL: postgresql+psycopg2://azs:azs_pass@postgres:5432/azs_bonus
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: change-me-in-production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
